<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageBoard</title>
    <style>
        /* e621 Dark Theme Palette */
        :root {
            --bg-color: #012e56;
            --container-bg: #001528;
            --sidebar-bg: #021a30;
            --text-color: #b4c7d9;
            --accent-color: #f2ac08;
            --button-bg: #033c6c;
            --button-hover: #055293;
            --tag-color: #2b7bb9;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--container-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            gap: 15px;
            flex-wrap: wrap;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
            cursor: pointer;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            flex: 1;
            max-width: 500px;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--button-bg);
            background-color: var(--sidebar-bg);
            color: #fff;
            font-size: 0.95rem;
        }

        .btn {
            background-color: var(--button-bg);
            color: #fff;
            padding: 8px 16px;
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn:hover {
            background-color: var(--button-hover);
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--button-bg);
            height: fit-content;
        }

        .sidebar h3 {
            margin-top: 0;
            color: var(--accent-color);
            border-bottom: 1px solid var(--button-bg);
            padding-bottom: 5px;
        }

        .tag-list {
            list-style: none;
            padding: 0;
            margin: 10px 0;
        }

        .tag-list li {
            margin: 5px 0;
            color: var(--tag-color);
            cursor: pointer;
            word-break: break-all;
        }

        .tag-list li:hover {
            text-decoration: underline;
            color: var(--accent-color);
        }

        .viewer-container {
            flex: 1;
            background-color: var(--container-bg);
            border-radius: 6px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid var(--button-bg);
        }

        .nav-buttons {
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
        }

        .image-display {
            max-width: 100%;
            max-height: 65vh;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .counter {
            margin-top: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1 onclick="resetSearch()">ImageBoard</h1>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search by tag, title, or author...">
            <button class="btn" onclick="executeSearch()">Search</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Sidebar Details -->
        <div class="sidebar">
            <h3>Post Information</h3>
            <p><strong>Title:</strong> <span id="post-title">-</span></p>
            <p><strong>Author:</strong> <span id="post-author">-</span></p>
            <p><strong>Description:</strong> <span id="post-desc">-</span></p>
            
            <h3>Tags</h3>
            <ul id="tag-list" class="tag-list"></ul>
            
            <hr style="border-color: var(--button-bg); margin-top: 20px;">
            <p><small>Shortcuts: Use <strong>←</strong> and <strong>→</strong> keys to flip images.</small></p>
        </div>

        <!-- Main Display -->
        <div class="viewer-container">
            <div class="nav-buttons">
                <button class="btn" onclick="showPrev()">◄ Previous</button>
                <button class="btn" onclick="showNext()">Next ►</button>
            </div>

            <img id="image-display" class="image-display" src="" alt="Post Image">

            <div class="counter" id="counter-text">Image 0 of 0</div>
        </div>
    </div>

    <script>
        // CONFIGURATION: Replace with your actual GitHub Raw URL
        const GITHUB_JSON_URL = 'https://raw.githubusercontent.com/dubiousEndCrystal/gallery-data/main/posts.json';

        let allPosts = [];
        let filteredPosts = [];
        let currentIndex = 0;

        async function loadPosts() {
            try {
                const response = await fetch(`${GITHUB_JSON_URL}?t=${Date.now()}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                allPosts = await response.json();
                filteredPosts = [...allPosts];
                
                if (filteredPosts.length > 0) {
                    updateViewer();
                } else {
                    document.getElementById('post-title').textContent = "No posts found.";
                }
            } catch (error) {
                console.error("Error loading posts from GitHub:", error);
                document.getElementById('post-title').textContent = "Failed to load gallery data.";
            }
        }

        function updateViewer() {
            if (filteredPosts.length === 0) return;

            const post = filteredPosts[currentIndex];

            // Update Image
            document.getElementById('image-display').src = post.imageUrl;

            // Update Metadata
            document.getElementById('post-title').textContent = post.title;
            document.getElementById('post-author').textContent = post.author;
            document.getElementById('post-desc').textContent = post.description;

            // Render Tags
            const tagListEl = document.getElementById('tag-list');
            tagListEl.innerHTML = '';
            post.tags.forEach(tag => {
                const li = document.createElement('li');
                li.textContent = `#${tag}`;
                li.onclick = () => filterByTag(tag);
                tagListEl.appendChild(li);
            });

            // Update Counter
            document.getElementById('counter-text').textContent = 
                `Image ${currentIndex + 1} of ${filteredPosts.length}`;
        }

        function showNext() {
            if (filteredPosts.length === 0) return;
            currentIndex = (currentIndex + 1) % filteredPosts.length;
            updateViewer();
        }

        function showPrev() {
            if (filteredPosts.length === 0) return;
            currentIndex = (currentIndex - 1 + filteredPosts.length) % filteredPosts.length;
            updateViewer();
        }

        function executeSearch() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            if (!query) {
                filteredPosts = [...allPosts];
            } else {
                filteredPosts = allPosts.filter(post => {
                    const matchesTag = post.tags.some(t => t.toLowerCase().includes(query));
                    const matchesTitle = post.title.toLowerCase().includes(query);
                    const matchesAuthor = post.author.toLowerCase().includes(query);
                    return matchesTag || matchesTitle || matchesAuthor;
                });
            }
            currentIndex = 0;
            updateViewer();
        }

        function filterByTag(tag) {
            document.getElementById('search-input').value = tag;
            executeSearch();
        }

        function resetSearch() {
            document.getElementById('search-input').value = '';
            filteredPosts = [...allPosts];
            currentIndex = 0;
            updateViewer();
        }

        // Enter key search handler
        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeSearch();
        });

        // Arrow key shortcuts
        document.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight') showNext();
            if (e.key === 'ArrowLeft') showPrev();
        });

        // Initialize App
        loadPosts();
    </script>
</body>
</html>
